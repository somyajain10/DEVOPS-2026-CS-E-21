apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: placement-portal
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    scrape_configs:
      - job_name: placement-backend
        metrics_path: /metrics
        static_configs:
          - targets: ["backend:5000"]
