apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-provisioning
  namespace: placement-portal
data:
  datasource.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        uid: prometheus
        type: prometheus
        access: proxy
        url: http://prometheus:9090
        isDefault: true
        editable: false
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: Placement Portal
        orgId: 1
        folder: Placement Portal
        type: file
        disableDeletion: true
        editable: true
        options:
          path: /etc/grafana/dashboards
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard
  namespace: placement-portal
data:
  placement-portal.json: |
    {
      "id": null,
      "uid": "placement-portal",
      "title": "College Placement Portal",
      "tags": ["placement-portal"],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "5s",
      "time": {"from": "now-15m", "to": "now"},
      "panels": [
        {
          "id": 1,
          "type": "timeseries",
          "title": "HTTP request rate by route",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [{"expr": "sum by (route) (rate(http_requests_total[1m]))", "legendFormat": "{{route}}", "refId": "A"}],
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 0}
        },
        {
          "id": 2,
          "type": "timeseries",
          "title": "Requests by HTTP status",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [{"expr": "sum by (status_code) (rate(http_requests_total[1m]))", "legendFormat": "{{status_code}}", "refId": "A"}],
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 0}
        },
        {
          "id": 3,
          "type": "timeseries",
          "title": "95th percentile request duration",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [{"expr": "histogram_quantile(0.95, sum by (le, route) (rate(http_request_duration_seconds_bucket[5m])))", "legendFormat": "{{route}}", "refId": "A"}],
          "fieldConfig": {"defaults": {"unit": "s"}, "overrides": []},
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 8}
        },
        {
          "id": 4,
          "type": "timeseries",
          "title": "Node.js heap and resident memory",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [
            {"expr": "nodejs_heap_size_used_bytes", "legendFormat": "Heap used", "refId": "A"},
            {"expr": "process_resident_memory_bytes", "legendFormat": "Resident memory", "refId": "B"}
          ],
          "fieldConfig": {"defaults": {"unit": "bytes"}, "overrides": []},
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 8}
        },
        {
          "id": 5,
          "type": "timeseries",
          "title": "Process CPU time rate",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [{"expr": "rate(process_cpu_seconds_total[1m])", "legendFormat": "CPU seconds/s", "refId": "A"}],
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 16}
        },
        {
          "id": 6,
          "type": "stat",
          "title": "Total requests since process start",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [{"expr": "sum(http_requests_total)", "refId": "A"}],
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 16}
        }
      ]
    }
